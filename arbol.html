<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbol</title>
    <style>
        body{ background: black; display: grid; justify-content: center; text-align: center;}
        h1{color: greenyellow; }
        p{color: teal; }
        .estrella{font-size: 100px;}
        #arbol{
            color: red;
        }
    </style>    
</head>
<body>
    <div class="estrella">*</div>
    <div class="arbol"></div>
    <h1>FELIZ NAVIDAD Y PROSPERO AÑO NUEVO 2024 </h1>
    <p>LES DESEA SALSA & SÓN BURGER A TODO EL MUNDO AMOR Y PAZ</p>
    <script>
        var hojas="";
        [10,2].forEach(row => {
            Array(row).fill('').forEach((v,i) => {
                hojas += ({ 
                    ...Array(9-i).fill("<span>-</span>"),
                    ...Array(1+i*2).fill("<span class ='rojo'>*</span>"),
                    ...Array(9-i).fill("<span>-</span>"),

                }.join(''))
                hojas += "<br>"
            })    
        })
        document.getElementById("arbol").innerHTML = hojas;
    </script>
    
</body>
</html>
